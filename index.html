<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Drowsiness Detector - Live Demo</title>
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-between">
    <header class="bg-slate-800 py-6 text-center border-b border-slate-700 shadow-md">
        <h1 class="text-2xl font-black text-blue-400">🚗 Real-Time Driver Drowsiness & Yawn Detector</h1>
        <p class="text-slate-400 mt-1">Author: <span class="bg-blue-600 px-3 py-1 rounded-full text-xs font-bold text-white">MYLA DIVYA SAI SRI</span></p>
    </header>
    <main class="max-w-md mx-auto my-8 p-6 bg-slate-800 rounded-xl shadow-xl flex flex-col items-center border border-slate-700">
        <div class="relative w-full aspect-video bg-slate-950 rounded-lg overflow-hidden border border-slate-600 flex items-center justify-center">
            <video id="webcam" class="absolute w-full h-full object-cover transform -scale-x-100 hidden" autoplay playsinline></video>
            <canvas id="output" class="absolute w-full h-full object-cover transform -scale-x-100 z-10"></canvas>
            <div id="loading" class="text-slate-400 text-sm font-medium animate-pulse">Initializing Live Panel...</div>
        </div>
        <button id="start-btn" class="mt-6 bg-blue-600 hover:bg-blue-500 font-bold py-3 px-6 rounded-lg shadow-md transition transform active:scale-95 cursor-pointer">Start Webcam Demo</button>
        <div class="w-full grid grid-cols-2 gap-4 mt-6">
            <div class="bg-slate-900 p-3 rounded-lg text-center border border-slate-700"><span class="text-xs text-slate-400 block">EAR (Eye)</span><span id="ear-val" class="text-2xl font-black text-blue-400">0.00</span></div>
            <div class="bg-slate-900 p-3 rounded-lg text-center border border-slate-700"><span class="text-xs text-slate-400 block">MAR (Mouth)</span><span id="mar-val" class="text-2xl font-black text-blue-400">0.00</span></div>
        </div>
        <p id="status-txt" class="mt-4 text-center font-bold text-emerald-400 text-lg">System Ready</p>
    </main>
    <footer class="text-center py-4 text-xs text-slate-600 border-t border-slate-800">Static WebAssembly Pipeline</footer>
    <script>
        const video = document.getElementById('webcam'), canvas = document.getElementById('output'), ctx = canvas.getContext('2d'), startBtn = document.getElementById('start-btn'), loadingDiv = document.getElementById('loading'), earEl = document.getElementById('ear-val'), marEl = document.getElementById('mar-val'), statusEl = document.getElementById('status-txt');
        let model, audioCtx = null;
        function triggerBeep() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
            osc.frequency.setValueAtTime(2500, audioCtx.currentTime); gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
            osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.2);
        }
        function dist(p1, p2) { return Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2)); }
        async function loadModel() {
            model = await faceLandmarksDetection.createDetector(faceLandmarksDetection.SupportedModels.MediaPipeFaceMesh, { runtime: 'mediapipe', solutionPath: 'https://jsdelivr.net' });
            loadingDiv.innerText = "✅ Model Loaded Successfully!";
        }
        startBtn.addEventListener('click', async () => {
            try {
                video.srcObject = await navigator.mediaDevices.getUserMedia({ video: true });
                video.classList.remove('hidden'); loadingDiv.classList.add('hidden'); startBtn.classList.add('hidden');
                canvas.width = 640; canvas.height = 480; detectFrame();
            } catch { alert("Camera access denied!"); }
        });
        async function detectFrame() {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                const predictions = await model.estimateFaces(video);
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                if (predictions.length > 0) {
                    const kp = predictions[0].keypoints;
                    const ear = (dist(kp[159], kp[145]) + dist(kp[160], kp[144])) / (2 * dist(kp[33], kp[133]));
                    const mar = dist(kp[13], kp[14]) / dist(kp[78], kp[308]);
                    earEl.innerText = ear.toFixed(2); marEl.innerText = mar.toFixed(2);
                    if (ear < 0.23) { statusEl.innerText = "🚨 DROWSINESS ALERT!!!"; statusEl.className = "mt-4 font-bold text-red-500 animate-pulse text-lg"; triggerBeep(); }
                    else if (mar > 0.55) { statusEl.innerText = "🥱 YAWN DETECTED!!!"; statusEl.className = "mt-4 font-bold text-amber-500 animate-pulse text-lg"; triggerBeep(); }
                    else { statusEl.innerText = "✅ Driver Safe"; statusEl.className = "mt-4 font-bold text-emerald-400 text-lg"; }
                }
            }
            requestAnimationFrame(detectFrame);
        }
        loadModel();
    </script>
</body>
</html>
